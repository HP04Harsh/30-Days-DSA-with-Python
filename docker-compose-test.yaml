version: '1.0'

services:
 backend:
   build:
     context: backend/
     dockerfile: Dockerfile
   volumes:
      - ./backend:/app
   ports:
      - "8000:8000"
   environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/postgres
   healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
   deploy:
       resources:
          limits:
              cpus: '0.50'
              memory: 512M
          reservations:
              cpus: '0.25'
              memory: 256M
 frontend:
   build:
     context: frontend/
     dockerfile: Dockerfile
   volumes:
      - ./frontend:/app
   ports:
      - "3000:3000"
   environment:
      - REACT_APP_API_URL=http://localhost:8000
   healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
   deploy:
       resources:
          limits:
              cpus: '0.50'
              memory: 512M
          reservations:
              cpus: '0.25'
              memory: 256M  


volumes:
  backend_data:
  frontend_data:

networks:
  backend_network:
    driver: bridge
  frontend_network:
    driver: bridge
                              